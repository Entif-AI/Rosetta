name: Semantic governance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx sync:check
      - run: pnpm exec nx affected -t spec-admission,test,lint,typecheck,build --base=origin/main --exclude=@entif-ai/source --parallel=3
      - run: pnpm run governance:admission
