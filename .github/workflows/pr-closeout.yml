name: Contract-aware PR closeout

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]

permissions:
  contents: read

jobs:
  contract-admission:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: closeout-admit-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      # Never check out or execute code from an untrusted PR head in pull_request_target.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { publishAdmission } = await import(`${process.env.GITHUB_WORKSPACE}/tools/github/contract-closeout.mjs`);
            const result = await publishAdmission({
              owner: context.repo.owner, repo: context.repo.repo,
              pullNumber: context.payload.pull_request.number,
              api: { pulls: github.rest.pulls, repos: github.rest.repos, paginate: github.paginate.bind(github) },
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            await core.summary.addHeading('Contract-aware closeout admission', 2)
              .addCodeBlock(JSON.stringify({ references: result.refs, dispositions: result.contract?.issues?.map(({ number, disposition }) => ({ number, disposition })) ?? [], semanticGateRequired: result.semanticGateRequired, errors: result.errors }, null, 2), 'json').write();
            if (result.errors.length) core.setFailed(result.errors.join('\n'));

  post-merge-reconcile:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: closeout-reconcile-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { reconcileMerge } = await import(`${process.env.GITHUB_WORKSPACE}/tools/github/contract-closeout.mjs`);
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
            });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
            });
            const result = await reconcileMerge({
              owner: context.repo.owner, repo: context.repo.repo, pull: pr, files,
              commitMessages: commits.map((item) => item.commit?.message ?? ''),
              api: { issues: github.rest.issues, paginate: github.paginate.bind(github) },
              defaultBranch: context.payload.repository.default_branch
            });
            await core.summary.addHeading('Post-merge issue disposition', 2)
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
