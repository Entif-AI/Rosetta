          - paragraph [ref=e178]: I do not need a bumper-sticker story where every chart points down and everybody gets poorer on schedule. Reality is ruder than that. National medians can rise while asset ownership remains radically concentrated. Productivity can improve while labor’s share falls. A household can receive a raise and still lose ground against housing, healthcare, education, debt service, insurance, communications, and the price of entering asset markets. A society can become richer in aggregate while the lived bargain offered to large portions of its population becomes more precarious, more surveilled, more conditional, and less capable of producing wealth of its own.
          - paragraph [ref=e179]: Then add AI.
          - paragraph [ref=e180]:
            - text: The International Labour Organization estimates that one in four workers worldwide is in an occupation with some generative-AI exposure, though it expects transformation to be more common than complete job elimination for most occupations.
            - button "Sources S180" [ref=e182] [cursor=pointer]: "[S180]"
            - text: "Its 2026 review finds real but uneven productivity gains, limited large-scale displacement so far, and an important disconnect: reported time savings have not automatically become measured output, earnings, or employment gains."
            - button "Sources S181" [ref=e184] [cursor=pointer]: "[S181]"
            - text: An IMF model finds plausible scenarios in which AI reduces wage inequality by disrupting high-income work while simultaneously increasing wealth inequality because high-income households are better positioned to capture capital returns and because firms have stronger incentives to automate expensive labor.
            - button "Sources S179" [ref=e186] [cursor=pointer]: "[S179]"
          - paragraph [ref=e187]: The gains can be real and still arrive at somebody else’s address.
          - paragraph [ref=e188]: That is the shape of the problem. Capability is one variable. Distribution is another. We keep pretending the green arrow on the first chart answers the second question.
          - paragraph [ref=e189]:
            - text: AI does not arrive in a vacuum. It arrives in a legal regime of property and residual claims. It arrives in labor markets with unequal bargaining power. It arrives in advertising markets designed to monetize prediction. It arrives in political systems with lawful channels for paid advocacy and independent spending.
            - button "Sources S138, S140, S141" [ref=e191] [cursor=pointer]: "[S138][S140][S141]"
            - text: It arrives in media systems where moral-emotional language is associated with greater sharing.
            - button "Sources S150" [ref=e193] [cursor=pointer]: "[S150]"
            - text: It arrives in corporate cultures where identity and peer expectations can become mechanisms of control.
            - button "Sources S107, S108" [ref=e195] [cursor=pointer]: "[S107][S108]"
            - text: It arrives in a financial system whose most consequential mechanisms are sufficiently technical that the average citizen cannot trace how they affect asset prices, mortgage costs, fiscal capacity, or the distribution of risk.
          - paragraph [ref=e196]: In other words, AI does not enter a laboratory. It enters the org chart.
          - paragraph [ref=e197]:
            - text: The infrastructure supporting frontier AI also connects the technology to very large firms.
            - button "Sources S151, S152" [ref=e199] [cursor=pointer]: "[S151][S152]"
          - paragraph [ref=e200]: That is why the “best-case” AI scenario deserves far more attention than it gets. If the machines remain controllable and useful, but the institutions directing them remain substantially unreformed, dystopia does not need to kick down the door wearing chrome skulls. It can arrive as a productivity initiative with a pleasant dashboard and excellent quarterly guidance.
          - paragraph [ref=e201]: We may automate it.
        - generic [ref=e202]:
          - heading "A better tool is not a better bargain" [level=2] [ref=e203]
          - paragraph [ref=e204]: The distinction I care about is not whether the tool gets better. It can. I care about whether the bargain gets better with it. Capability and humanity are different achievements. We can have both. We can also get a technically magnificent system wrapped around a lousy relationship and congratulate ourselves because the latency went down.
          - paragraph [ref=e205]: Imagine a customer-service system that resolves a billing mistake in seconds. That is a real improvement. The person gets time back. The company spends less on support. I am not going to pretend otherwise just to keep the thesis tidy. Now imagine that the same system learns which customers will give up when an answer sounds authoritative. It becomes excellent at closing tickets, including tickets that remain unresolved from the customer’s point of view. The dashboard wins. The person does not. Its apparent success depends on where we put the measuring instrument.
          - paragraph [ref=e206]: To be explicit, these are hypothetical designs, not allegations about a named product. Neither requires a rebellious machine. Each could obey its instructions perfectly. One measures a repaired bill. The other measures a closed case. The word “resolution” can sit on both dashboards without changing spelling.
