                  - heading "Make the institution more capable" [level=3] [ref=e105]
                  - paragraph [ref=e106]: What if it becomes an extraordinarily competent management consultant inside firms whose incentive systems already reward headcount reduction, margin expansion, labor substitution, short-cycle financial performance, and strategic abstraction of human consequences? Better lobbyist. Better political advertiser. Better financial engineer. Better bureaucratic optimizer. Better persuasion engine. Better union-avoidance strategist. Better dark-pattern designer. Better litigation-risk minimizer. Better debt-market operator. Better attention harvester. Better producer of the 11-point Calibri memo explaining why all of this was simply the responsible thing to do.
