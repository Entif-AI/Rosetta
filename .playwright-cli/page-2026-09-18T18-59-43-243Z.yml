          - paragraph [ref=e237]: That tiny change contains a ridiculous amount of this essay. A word, a metric, a contract, and an ownership arrangement can determine what technological progress means in practice. Three words on a dashboard can move the moral question off-screen. The model’s intelligence matters. So does the translation from a human problem into an institutional target. So does the question of who can reject that translation.
          - paragraph [ref=e238]: "It is possible to make a system fairer within the wrong frame. Suppose an automated process applies an unreasonable fee with perfect consistency. It never discriminates between customers. It explains the fee clearly. It follows every instruction given to it. Congratulations: we have built a system that is consistent, explainable, obedient, and exquisitely fair about charging everyone the same bullshit fee. Equal treatment describes the application of the rule. It does not establish that the rule serves the people subject to it."
          - paragraph [ref=e239]: Conversely, an institution may have a worthwhile objective and a defective tool. A model may make errors while processing a service meant to help. Correcting those errors matters. My concern is not an excuse to ignore technical alignment. It is an argument against making technical alignment responsible for work that belongs to the surrounding system.
          - paragraph [ref=e240]: A microscope can be perfectly calibrated and still be pointed at the wrong sample. The precision is real. So is the mistake. A decision system can be perfectly calibrated and asked the wrong question. Calibration matters. It does not choose the question.
        - generic [ref=e241]:
          - heading "What counts as getting better?" [level=2] [ref=e242]
          - paragraph [ref=e243]: People do not live as one clean economic unit. The same person can be an employee, a customer, a parent, a tenant, a borrower, a saver, and a shareholder. The spreadsheet gets one row. The person gets all seven roles and the consequences of each. A change may help one role while hurting another. A cheaper service might accompany a lost income. A rising investment account might accompany a rising cost of entry for a younger household. A faster workplace might leave less time outside it.
          - paragraph [ref=e244]: That does not mean gains and losses always cancel. It means one favorable number cannot tell us whose life improved. A national average does not contain an automatic answer to a household’s question. A household average does not contain an automatic answer to a child’s question. Change the unit and the story changes with it.
          - paragraph [ref=e245]: Consider a simple example. Two workers each gain a tool that lets them finish the same task in half the time. One keeps the same pay and goes home earlier. The other receives twice as much work. A third workplace eliminates one of their roles and transfers the remaining work to the other. Same technical miracle. Three different bargains.
