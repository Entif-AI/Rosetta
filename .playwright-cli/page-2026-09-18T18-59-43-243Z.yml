                  - heading "Ask what the success means" [level=3] [ref=e108]
                  - paragraph [ref=e109]: That is not misalignment in the usual engineering sense.
                  - paragraph [ref=e110]: That is alignment.
                  - paragraph [ref=e111]: The system did what somebody asked.
                  - paragraph [ref=e112]: Which is precisely the problem. Nobody had to hate us. Nobody had to become conscious. Nobody even had to be wrong. We handed the machine an objective and it came back with a gold star.
                  - paragraph [ref=e113]: The question is whether the thing somebody asked deserves to be done faster.
          - paragraph [ref=e115]:
            - text: "This essay begins from a proposition that technical AI discourse often treats as secondary:"
            - strong [ref=e116]: the alignment target is a political, economic, moral, and institutional choice before it is an optimization problem.
            - text: Researchers working on social choice and pluralistic alignment have already formalized part of this problem. Human preferences are diverse and often incompatible. You do not solve that by collecting enough thumbs-up signals until governance tumbles out of the pile like a toy from a cereal box. Aggregating preferences into a model objective requires rules about whose preferences count, how conflicts are resolved, which values are non-negotiable, and who gets authority over the aggregation procedure.
            - button "Sources S183, S185" [ref=e118] [cursor=pointer]: "[S183][S185]"
            - text: A 2026 audit of public frontier-lab materials argues that there is still no clear public evidence that pluralism itself has become an explicit training and evaluation objective in the public materials it examined. The audit does not establish what every lab does internally.
            - button "Sources S184" [ref=e120] [cursor=pointer]: "[S184]"
          - paragraph [ref=e121]: That is the AI version of an older mistake.
          - paragraph [ref=e122]: "For decades we have treated optimization as if it were a moral solvent. Put a goal in enough dashboards, bind it to compensation, give it a respectable acronym, and eventually “Should we do this?” gets demoted to the little red risk cell underneath “How fast can we do it?” Profitability, efficiency, shareholder return, GDP growth, engagement, productivity, utilization, conversion, ranking accuracy, and market liquidity have become objective functions with enormous institutional authority. Once an objective acquires that authority, arguments about its morality tend to be demoted into constraints: comply with the law; avoid reputational disaster; satisfy the regulator; preserve enough employee morale; keep churn tolerable; do not cross the line so badly that the expected penalty exceeds the gain."
          - paragraph [ref=e123]: The problem is not that all optimization is evil. That would almost be comforting. The problem is that optimization is indifferent to whether the objective is worthy.
          - paragraph [ref=e124]: A corporation can optimize profit without being conscious. Market participants can produce patterns of allocation without a single mind directing the market. A bureaucracy can preserve itself without wanting to live. A recommender can optimize engagement without hating democracy. A political fundraising system can concentrate influence without a roomful of conspirators agreeing to concentrate influence. A set of institutions can therefore exhibit coherent, durable, self-reinforcing tendencies without any single consciousness owning the whole result. No mustache-twirling required. The incentives can carry the plot by themselves.
          - paragraph [ref=e125]:
            - text: That matters for AI because machine intelligence does not need consciousness to inherit the same structure. Specification-gaming research already shows agents satisfying literal objectives in ways designers did not intend.
            - button "Sources S169" [ref=e127] [cursor=pointer]: "[S169]"
            - text: Goal-misgeneralization research shows systems can generalize competence while pursuing an undesired learned goal in new conditions.
            - button "Sources S170" [ref=e129] [cursor=pointer]: "[S170]"
            - text: The relevant danger is not a machine developing human resentment. It is competent optimization propagating through institutional objective functions faster than human beings can inspect, contest, or redesign them.
          - paragraph [ref=e130]:
            - text: Before AI enters the picture, the United States already presents an uncomfortable substrate. In the second quarter of 2026, the Bureau of Labor Statistics reported labor’s share of nonfarm business-sector output at 52.8%, the lowest value in a series beginning in 1947. Real hourly compensation was down 0.1% over four quarters.
            - button "Sources S117" [ref=e132] [cursor=pointer]: "[S117]"
            - text: Federal Reserve distributional accounts for the first quarter of 2026 imply roughly 68% of household net worth is held by the top tenth of the distribution, while the bottom half holds roughly 2.5%.
            - button "Sources S118" [ref=e134] [cursor=pointer]: "[S118]"
            - text: At the same time, Census reported that median household income rose 2.6% in 2025.
            - button "Sources S119" [ref=e136] [cursor=pointer]: "[S119]"
          - paragraph [ref=e137]: Those facts belong together.
