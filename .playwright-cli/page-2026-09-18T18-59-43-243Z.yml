          - paragraph [ref=e284]:
            - text: No productivity benchmark alone tells us which arrangement will occur. That depends on demand, bargaining, staffing, ownership, contractual terms, and the choices of the people who control the workplace. Those are not bugs inside the model. They are properties of the environment into which it is deployed. The empirical literature already distinguishes automation that displaces tasks from new tasks that can increase demand for labor. It does not support a universal rule that every technical improvement must either destroy employment or lift everyone together.
            - button "Sources S114" [ref=e286] [cursor=pointer]: "[S114]"
            - text: The benchmark is not the contract.
          - paragraph [ref=e287]: Abundance is a production claim. Access is a power claim. Those are not synonyms. An abundant service behind a price gate can be useful and still unavailable to someone who needs it. An abundant supply of persuasive language may lower communication costs while raising the cost of knowing whom to trust. An abundant supply of applications for a scarce job does not create an abundant supply of jobs.
          - paragraph [ref=e288]: Some things stubbornly refuse to become software. Attention is finite. Time with another person is finite. A place in a particular neighborhood cannot be duplicated merely by duplicating a software service. Intelligence can make some inputs cheap without making every scarce relationship, location, or right cheap.
          - paragraph [ref=e289]: I do not need to predict the final shape of an AI economy to insist on those distinctions. They hold even when the technology performs well. Capability is not a substitute for access, distribution, or control.
        - generic [ref=e290]:
          - heading "I learned this inside Gartner" [level=2] [ref=e291]
          - paragraph [ref=e292]: I did not arrive at this argument by staring at a labor chart. Part of it arrived with lunch.
          - paragraph [ref=e293]: "At Gartner, I worked with people who were smart, generous with one another, serious about their craft, and willing to work brutally hard when the work felt important. The company fed us extraordinarily well. The cafeteria had excellent chefs, and meals were sold so cheaply that staying on campus from early morning into the evening was easy. That sounds like I am blaming the cafeteria. I am not. The food was good. It also made very long days logistically easier. Symposium was treated as a privilege: if you were valuable enough to send, you were going somewhere exciting, surrounded by the most important people in the industry."
          - paragraph [ref=e294]: It was also work.
          - paragraph [ref=e295]: In one September leading into a product launch at Symposium, I logged more than 300 hours. September, to my knowledge, still had thirty days. At the event itself, critical roles could mean sixteen-hour days. Nobody had to threaten me into doing it. That is the important part. I was convinced that pouring myself into the company was good for the company, good for the team, and ultimately good for me.
          - paragraph [ref=e296]:
            - text: That is the part a clean labor-cost model cannot see. A payroll line sees hours. It does not see loyalty, ambition, pride, friendship, status, access, or the desire not to let other good people down. The institution benefited from all of them. Organizational research on normative control and peer-enforced norms gives us language for that broader mechanism.
            - button "Sources S107, S108" [ref=e298] [cursor=pointer]: "[S107][S108]"
          - paragraph [ref=e299]: Near the end of my tenure, the story changed fast. A new CIO arrived, technology teams were hit by layoffs, and design, product, and engineering work began moving toward a shop in Gurgaon. I watched people who had built careers around the company’s language of family confront the much colder language of sourcing and cost.
          - paragraph [ref=e300]: Both versions of Gartner were real to me. The opportunity was real. The food was good. The colleagues were good. The pride was real. So was the 300-hour month. The mistake would be forcing one version to cancel the other. An institution can genuinely enrich your life while retaining the right to turn you back into a cost center.
          - paragraph [ref=e301]: "That is exactly why the substrate matters. A capable optimizer does not need to invent this arrangement. We already did the product discovery. It inherits the metrics, budgets, categories, incentives, and authority structures already there. Give the institution a tool that can reduce labor costs, intensify output, score performance, redesign workflows, and explain the result in immaculate professional language, and it will not need a villain monologue. It will need a dashboard. The crucial question is still the old human one:"
          - paragraph [ref=e302]:
            - strong [ref=e303]: What did we tell it to optimize, and who had the power to choose?
        - generic [ref=e304]:
          - heading "What I mean by acceleration" [level=2] [ref=e305]
          - paragraph [ref=e306]: The title is literal. By acceleration I mean that artificial intelligence gives objectives more reach, speed, and persistence. The institutions that own it, buy it, regulate it, deploy it, and measure its success decide which objectives receive that extra capacity.
          - paragraph [ref=e307]: That can make a humane system dramatically better. It can also make an extractive system dramatically more efficient. Intelligence does not choose between those futures for us.
          - paragraph [ref=e308]: So every promise of improvement has to be followed through the relationships around it. Who pays for it? Who owns the result? Who absorbs the error? Who can contest the decision? Who has the time and knowledge to notice that a decision was made? Who benefits when the benefit is described as universal?
          - paragraph [ref=e309]: Those questions do not begin in a distant future. They begin in the language of a bill, a workplace, a market category, and a performance report. Before looking for an intelligence that can understand everything, we should notice how often our existing institutions make ordinary things difficult to understand.
