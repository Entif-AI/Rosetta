                  - paragraph [ref=e101]:
                    - text: What if it becomes an extraordinarily competent advertising optimizer in a system that already monetizes attention and behavioral exhaust? What if it becomes an extraordinarily competent pricing engine in markets already learning to infer willingness to pay from location, browsing history, shopping behavior, mouse movements, and abandoned carts? That machinery is not science-fiction set dressing. The Federal Trade Commission has already documented commercial intermediaries offering retailers exactly that class of individualized pricing and product-exposure machinery.
                    - button "Sources S124" [ref=e103] [cursor=pointer]: "[S124]"
