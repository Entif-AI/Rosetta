          - paragraph [ref=e61]: I am less afraid of a machine waking up angry than I am of a machine waking up obedient.
          - paragraph [ref=e62]:
            - text: "That sentence reverses the danger I first learned to picture. The cinematic version is almost courteous in its clarity: the machine wakes up, becomes a villain, escapes the box, steals the infrastructure, and turns the future into a very short third act. Real loss-of-control research is less cartoonish than that, and it deserves to be. The International AI Safety Report, published in February 2026, assessed the systems it examined as showing early signs of relevant capabilities, but not yet the combination needed for loss of control. Experts disagreed widely about future probabilities."
            - button "Sources S173" [ref=e64] [cursor=pointer]: "[S173]"
          - paragraph [ref=e65]: I do not dismiss that risk. My concern starts one floor lower.
          - paragraph [ref=e66]: What if we build increasingly capable intelligence, solve enough of the technical alignment problem to keep it under human and institutional control, and then point it at the civilization we already have?
          - paragraph [ref=e67]: What if it works?
