          - paragraph [ref=f11e178]: There is a further possibility that matters beyond any one advisory firm. Independent organizations can make individually reasonable decisions that become collectively brittle when they rely on the same reference points.
          - paragraph [ref=f11e179]: Imagine ten firms choosing a supplier. Each uses the same benchmark, receives a similar recommendation, and concludes that choosing the widely endorsed option reduces risk. Each decision may be defensible on its own. Together they may create a dependency on a single service whose failure would affect all ten. The common choice has changed the distribution of risk even if nobody made an obviously foolish decision.
          - paragraph [ref=f11e180]:
            - text: "Kleinberg and Raghavan’s work on algorithmic monoculture formalizes a related possibility: under their model’s conditions, a shared algorithm can improve an individual’s prediction while worsening collective outcomes through the correlation it introduces. This is not a finding that shared tools are generally harmful. It is a reason to distinguish the accuracy of one decision from the resilience of many decisions made with the same machinery."
            - button "Sources S203" [ref=f11e182] [cursor=pointer]: "[S203]"
          - paragraph [ref=f11e183]: The distinction becomes especially important when an AI adviser draws on sources that are themselves widely shared. Apparent agreement among several outputs may reflect common training material, a shared upstream provider, or the same retrieval source. It need not represent several independent investigations. Five answers can have one ancestor.
          - paragraph [ref=f11e184]: That does not make consensus useless. It changes what consensus can establish. Agreement among independent measurements may strengthen confidence in a fact. Agreement among summaries of the same measurement does not add five measurements. A procurement system that cannot distinguish those cases may turn repetition into apparent corroboration.
          - paragraph [ref=f11e185]: The failure can be subtle. A market category appears in a research report. Vendors adopt the language. Customers repeat it in case studies. An AI system retrieves the report, vendor pages, and customer stories as separate evidence. The resulting answer describes a mature consensus. Some of that consensus may be real experience. Some may be the echo of the original classification.
          - paragraph [ref=f11e186]: This is a hypothetical provenance problem, not a claim that any specific model has performed this sequence. It shows why source independence matters when automated analysis becomes cheap. The system needs to know not only what documents say, but whether their apparent agreement arises from distinct observations or a common chain of influence.
        - generic [ref=f11e187]:
          - heading "The category can become an entrance fee" [level=2] [ref=f11e188]
          - paragraph [ref=f11e189]: Categories also shape who gets considered. A firm can have an effective product and still struggle to explain itself in the language buyers use. A new approach may solve a problem that existing categories divide among several markets. A buyer may never encounter it because the search begins with the old categories.
          - paragraph [ref=f11e190]: The issue is not that every new entrant is secretly superior. Most claims of novelty still need scrutiny. The issue is that a classification system can make some forms of scrutiny easy and others difficult. A vendor that fits an established comparison table can be evaluated quickly. A vendor that changes the comparison may first have to persuade a buyer to ask a different question.
          - paragraph [ref=f11e191]: AI can lower that barrier by searching across categories and explaining unfamiliar designs. It can also reinforce it by treating the most common market vocabulary as the best representation of the problem. Which result occurs depends on retrieval, incentives, evaluation, and the opportunity to inspect alternatives. There is no automatic consequence of the model becoming more fluent.
          - paragraph [ref=f11e192]: Here the markets for language and authority meet the markets for products. A firm may spend resources building features that satisfy a widely used category, even when some customers would prefer a different trade-off. The category does not have to be false to affect what gets built. It only has to be consequential.
          - paragraph [ref=f11e193]: The resulting feedback is stronger when the same vocabulary shapes investment, hiring, procurement, and public discussion. A category can become a common coordination device. That can reduce confusion and speed useful adoption. It can also narrow the range of ideas that institutions consider practical. The relevant question is which function dominates in a particular setting, not whether categories should exist at all.
          - paragraph [ref=f11e194]: I want tools that make this dependence visible. When an adviser says that a product is mature, it should be possible to ask mature by which criteria. When it describes a market as consolidated, it should identify the boundary used to count the market. When it calls a practice standard, it should distinguish widespread use from demonstrated merit.
          - paragraph [ref=f11e195]: Those are not demands for endless qualification. They are demands for the few distinctions that prevent a useful shorthand from becoming an unearned verdict. A good adviser should save a person work without confiscating the person’s judgment.
          - paragraph [ref=f11e196]: This brings the analysis back inside the organization. The same systems that tell a firm which vendor is credible also help it decide which goals, costs, and employee behaviors count as responsible management. The market for external authority feeds the internal machinery of the firm.
