        - generic [ref=f11e60]:
          - paragraph [ref=f11e61]: I spent years inside institutions that do not merely analyze markets. They help markets decide what they are.
          - paragraph [ref=f11e62]: A company like Gartner can be described innocently as a research and advisory business. It gathers information, talks to vendors, talks to customers, employs analysts, develops frameworks, publishes research, and helps enterprises make technology decisions. All of that is true, and incomplete.
          - paragraph [ref=f11e63]: When an institution becomes sufficiently authoritative, its categories begin to affect the objects being categorized. Vendors want to appear in the category. They change roadmaps, messaging, features, and acquisition strategies around the criteria. Buyers build shortlists around the category. Procurement teams use the category to demonstrate diligence. Executives use the category to defend decisions. Journalists use it to explain the market. Investors use it to understand competitive position.
          - paragraph [ref=f11e64]: The map becomes part of the terrain.
          - paragraph [ref=f11e65]:
            - text: The Magic Quadrant is almost too elegant an example. Gartner itself describes the two axes as Ability to Execute and Completeness of Vision, and it explicitly warns that the Quadrant should be a starting point rather than a universal declaration that every company in the upper-right “Leaders” box is best for every buyer.
            - button "Sources S106" [ref=f11e67] [cursor=pointer]: "[S106]"
          - figure [ref=f11e68]:
