            - generic [ref=f11e176]:
              - text: A useful shortcut can become an institutional condition of credibility. The diagram describes a mechanism, not proof of corrupt intent or a pay-to-play relationship.
              - link "Rankings and reactivity · S105" [ref=f11e177] [cursor=pointer]:
