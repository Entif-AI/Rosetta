version: 0.1-draft
status: proposed
purpose: >-
  Disclosure-safe projection of relationships between public Rosetta contracts and
  protected Entif implementation authorities. Protected content is referenced only
  by opaque IPR identifiers. This file MUST NOT contain private-repository URLs or
  protected mechanism details.

invariants:
  - public_contracts_are_independently_meaningful
  - private_implementation_must_not_redefine_public_meaning
  - protected_references_use_opaque_ipr_ids_only
  - public_artifacts_must_not_link_directly_to_protected_repository
  - internal_engineering_resolves_protected_requirements_before_behavioral_changes

relationship_types:
  - implements
  - constrains
  - consumes
  - supersedes
  - derived_from
  - validated_by
  - represented_by
  - produces
  - blocks
  - requires_review_of

