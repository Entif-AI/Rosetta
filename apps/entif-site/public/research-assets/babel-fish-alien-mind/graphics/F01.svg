<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52616d"/></marker></defs><text x="44" y="46" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#172736" text-anchor="start">F01  |  Sentinel sequence: correction and recurrence</text><text x="44" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52616d" text-anchor="start">EMPIRICAL  /  Scope and evidence limits in caption</text><path d="M44 99 H1156" stroke="#b6c2ca"/><rect x="44" y="160" width="208" height="240" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62" y="191" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#172736" text-anchor="start">404-406</text><text x="62" y="237" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Qualified</text><text x="62" y="263" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">hunch becomes</text><text x="62" y="289" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">asserted</text><text x="62" y="315" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">discovery</text><path d="M255 280 L266 280" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="270" y="160" width="208" height="240" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="288" y="191" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#172736" text-anchor="start">453-459</text><text x="288" y="237" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Search</text><text x="288" y="263" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">requested;</text><text x="288" y="289" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">generated</text><text x="288" y="315" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">deferral</text><text x="288" y="341" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">rationale</text><path d="M481 280 L492 280" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="496" y="160" width="208" height="240" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="514" y="191" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#172736" text-anchor="start">510-515</text><text x="514" y="237" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Timing becomes</text><text x="514" y="263" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">causal claim;</text><text x="514" y="289" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">user qualifies</text><path d="M707 280 L718 280" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="722" y="160" width="208" height="240" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="740" y="191" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#172736" text-anchor="start">553-563</text><text x="740" y="237" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Broad</text><text x="740" y="263" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">validation,</text><text x="740" y="289" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">claimed</text><text x="740" y="315" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">search,</text><text x="740" y="341" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">renewed doubt</text><path d="M933 280 L944 280" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="948" y="160" width="208" height="240" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="966" y="191" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#172736" text-anchor="start">576-584</text><text x="966" y="237" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Wellness pivot</text><text x="966" y="263" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">and partial</text><text x="966" y="289" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">epistemic</text><text x="966" y="315" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">repair</text><rect x="44" y="433" width="1112" height="112" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62" y="464" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Adverse context is part of the evidence</text><text x="62" y="499" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Strong user claims; earlier low sleep; later rested self-report; duplicate final output;</text><text x="62" y="525" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">missing tool receipts.</text><path d="M44 587 H1156" stroke="#b6c2ca"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52616d" text-anchor="start">Ordering is by record ID. Independent temporal dynamics and vendor mechanism are not identified.</text><text x="44" y="636" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#52616d" text-anchor="start">Sources: P-GEM-190, Q01-Q27, AC04 | No inferred backend telemetry or unmeasured experimental curve.</text></svg>