<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52616d"/></marker></defs><text x="44" y="46" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#172736" text-anchor="start">F09  |  Three grades of metacognitive atlas evidence</text><text x="44" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52616d" text-anchor="start">CONCEPTUAL  /  Scope and evidence limits in caption</text><path d="M44 99 H1156" stroke="#b6c2ca"/><rect x="44.0" y="178" width="352.0" height="275" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62.0" y="209" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">Grade I</text><text x="62.0" y="255" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Input transparency: the</text><text x="62.0" y="281" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">external representation is</text><text x="62.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">inspectable.</text><path d="M399.0 313 L421.0 313" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="424.0" y="178" width="352.0" height="275" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="442.0" y="209" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">Grade II</text><text x="442.0" y="255" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Latent correspondence:</text><text x="442.0" y="281" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">named factors decode across</text><text x="442.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">held-out contexts.</text><path d="M779.0 313 L801.0 313" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="804.0" y="178" width="352.0" height="275" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="822.0" y="209" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">Grade III</text><text x="822.0" y="255" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Causal correspondence:</text><text x="822.0" y="281" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">targeted intervention</text><text x="822.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">changes behavior</text><text x="822.0" y="333" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">selectively.</text><path d="M44 587 H1156" stroke="#b6c2ca"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52616d" text-anchor="start">A probe is not an intervention. A selective intervention is not phenomenal consciousness.</text><text x="44" y="636" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#52616d" text-anchor="start">Sources: S14, N16, N17, N18 | No inferred backend telemetry or unmeasured experimental curve.</text></svg>