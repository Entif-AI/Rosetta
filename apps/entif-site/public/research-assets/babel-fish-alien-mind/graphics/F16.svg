<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52616d"/></marker></defs><text x="44" y="46" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#172736" text-anchor="start">F16  |  Where the theory can lose</text><text x="44" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52616d" text-anchor="start">CONCEPTUAL  /  Scope and evidence limits in caption</text><path d="M44 99 H1156" stroke="#b6c2ca"/><rect x="44.0" y="178" width="257.0" height="275" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62.0" y="209" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">Representation</text><text x="62.0" y="255" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Controlled English</text><text x="62.0" y="281" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">or a matched code</text><text x="62.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">ties at equal full</text><text x="62.0" y="333" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">cost.</text><path d="M304.0 313 L326.0 313" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="329.0" y="178" width="257.0" height="275" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="347.0" y="209" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">Ithkuil-</text><text x="347.0" y="237" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">specificity</text><text x="347.0" y="283" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Generic typed</text><text x="347.0" y="309" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">factors match the</text><text x="347.0" y="335" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">specialized</text><text x="347.0" y="361" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">grammar.</text><path d="M589.0 313 L611.0 313" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="614.0" y="178" width="257.0" height="275" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="632.0" y="209" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">Interpretability</text><text x="632.0" y="255" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Probes decode, but</text><text x="632.0" y="281" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">interventions are</text><text x="632.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">nonspecific.</text><path d="M874.0 313 L896.0 313" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="899.0" y="178" width="257.0" height="275" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="917.0" y="209" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#172736" text-anchor="start">Safety bridge</text><text x="917.0" y="255" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">A simpler external</text><text x="917.0" y="281" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">controller matches</text><text x="917.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">the effect.</text><path d="M44 587 H1156" stroke="#b6c2ca"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52616d" text-anchor="start">Program-changing support requires independent replication. The local smoke does not meet that bar.</text><text x="44" y="636" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#52616d" text-anchor="start">Sources: E1-E4, E6-E12 | No inferred backend telemetry or unmeasured experimental curve.</text></svg>