<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52616d"/></marker></defs><text x="44" y="46" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#172736" text-anchor="start">F05  |  Nested Conway: a bounded interface hypothesis</text><text x="44" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52616d" text-anchor="start">CONCEPTUAL  /  Scope and evidence limits in caption</text><path d="M44 99 H1156" stroke="#b6c2ca"/><rect x="44" y="130" width="900" height="84" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62" y="161" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Representation</text><text x="400" y="181" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#172736" text-anchor="start">Which distinctions can be expressed?</text><path d="M1060 155 L1060 235" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="79" y="231" width="865" height="84" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="97" y="262" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Latent computation</text><text x="400" y="282" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#172736" text-anchor="start">Which distinctions are learned and used?</text><path d="M1060 256 L1060 336" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="114" y="332" width="830" height="84" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="132" y="363" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Subsystem boundary</text><text x="400" y="383" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#172736" text-anchor="start">Which evidence survives an interface?</text><path d="M1060 357 L1060 437" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="149" y="433" width="795" height="84" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="167" y="464" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Organization</text><text x="400" y="484" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#172736" text-anchor="start">Which roles can correct a decision?</text><text x="979" y="530" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#172736" text-anchor="start">Test each bridge</text><path d="M44 587 H1156" stroke="#b6c2ca"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52616d" text-anchor="start">Local competence plus lossy interfaces can motivate system-level tests; no neural Conway law is established.</text><text x="44" y="636" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#52616d" text-anchor="start">Sources: S49 | No inferred backend telemetry or unmeasured experimental curve.</text></svg>