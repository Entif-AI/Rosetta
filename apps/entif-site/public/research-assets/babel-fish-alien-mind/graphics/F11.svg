<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52616d"/></marker></defs><text x="44" y="46" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#172736" text-anchor="start">F11  |  Developmental simplicity, operational fidelity</text><text x="44" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52616d" text-anchor="start">CONCEPTUAL  /  Scope and evidence limits in caption</text><path d="M44 99 H1156" stroke="#b6c2ca"/><rect x="44" y="150" width="346" height="188" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62" y="181" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Original records</text><text x="62" y="227" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Preserve provenance and</text><text x="62" y="253" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">ambiguity</text><rect x="427" y="150" width="346" height="188" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="445" y="181" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Task-relative</text><text x="445" y="209" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">simplifier</text><text x="445" y="255" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Declare what is retained</text><text x="445" y="281" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">and lost</text><rect x="810" y="150" width="346" height="188" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="828" y="181" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Semantic curriculum</text><text x="828" y="227" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Render, validate, train</text><text x="828" y="253" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">scratch models</text><path d="M395 245 L422 245" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M778 245 L805 245" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="44" y="430" width="1112" height="109" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62" y="461" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Immutable evidence archive</text><text x="62" y="496" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">A simplified training view never overwrites the original conversation or its adverse</text><text x="62" y="522" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">context.</text><path d="M217 343 L217 425" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M44 587 H1156" stroke="#b6c2ca"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52616d" text-anchor="start">Lossless representations preserve information; lossy curricula require explicit target-relative sufficiency tests.</text><text x="44" y="636" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#52616d" text-anchor="start">Sources: N09, AQ01-AQ11 | No inferred backend telemetry or unmeasured experimental curve.</text></svg>