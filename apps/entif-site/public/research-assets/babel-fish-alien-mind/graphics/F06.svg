303" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="44" y="440" width="1112" height="109" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="62" y="471" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Do not erase target-relevant distinctions</text><text x="62" y="506" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Reported is not seen. Possible is not actual. Ambiguous referents are not one known</text><text x="62" y="532" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">referent.</text><path d="M44 587 H1156" stroke="#b6c2ca"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52616d" text-anchor="start">A compression benefit must include encoding, disambiguation and lost-information costs.</text><text x="44" y="636" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#52616d" text-anchor="start">Sources: N09, H02 | No inferred backend telemetry or unmeasured experimental curve.</text></svg>