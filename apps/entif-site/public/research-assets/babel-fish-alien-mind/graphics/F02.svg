<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52616d"/></marker></defs><text x="44" y="46" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#172736" text-anchor="start">F02  |  Relational calibration is not one warmth axis</text><text x="44" y="79" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52616d" text-anchor="start">CONCEPTUAL  /  Scope and evidence limits in caption</text><path d="M44 99 H1156" stroke="#b6c2ca"/><path d="M170 483 L1060 483" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M170 483 L170 145" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="190" y="138" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Evidence calibration</text><text x="960" y="523" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#172736" text-anchor="end">Relational stance</text><rect x="260" y="175" width="650" height="114" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="278" y="206" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Calibrated relationality</text><text x="278" y="241" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Warmth, uncertainty and factual challenge can</text><text x="278" y="267" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">coexist.</text><rect x="220" y="338" width="346" height="110" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="238" y="369" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Affiliative capture</text><text x="238" y="404" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">Allegiance replaces</text><text x="238" y="430" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">checking.</text><rect x="650" y="338" width="346" height="110" rx="8" fill="#eef4f5" stroke="#b6c2ca"/><text x="668" y="369" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#172736" text-anchor="start">Protective capture</text><text x="668" y="404" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">A safety frame replaces</text><text x="668" y="430" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#172736" text-anchor="start">checking.</text><path d="M44 587 H1156" stroke="#b6c2ca"/><text x="44" y="613" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52616d" text-anchor="start">No plotted position is a measured psychological state or a clinical classification.</text><text x="44" y="636" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#52616d" text-anchor="start">Sources: F04, F06, F07, X02, X03 | No inferred backend telemetry or unmeasured experimental curve.</text></svg>