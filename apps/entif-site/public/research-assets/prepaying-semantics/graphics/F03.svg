<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Development is a checkpointed state machine</title><desc>Curriculum + recovery</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F03 / CURRICULUM + RECOVERY</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">Development is a checkpointed state machine</text><circle cx="190" cy="310" r="51" fill="#167d8d"/><text x="190" y="322" font-family="DejaVu Sans,sans-serif" font-size="32" fill="white" font-weight="700" text-anchor="middle">S0</text><circle cx="580" cy="225" r="51" fill="#167d8d"/><text x="580" y="237" font-family="DejaVu Sans,sans-serif" font-size="32" fill="white" font-weight="700" text-anchor="middle">S1</text><circle cx="580" cy="430" r="51" fill="#167d8d"/><text x="580" y="442" font-family="DejaVu Sans,sans-serif" font-size="32" fill="white" font-weight="700" text-anchor="middle">S2</text><circle cx="990" cy="330" r="51" fill="#167d8d"/><text x="990" y="342" font-family="DejaVu Sans,sans-serif" font-size="32" fill="white" font-weight="700" text-anchor="middle">S3</text><circle cx="990" cy="610" r="51" fill="#167d8d"/><text x="990" y="622" font-family="DejaVu Sans,sans-serif" font-size="32" fill="white" font-weight="700" text-anchor="middle">S4</text><path d="M243,290 L517,237" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M243,332 L517,413" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M230,350 L925,590" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M635,240 L929,313" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M635,414 L929,347" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="82" y="470" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">DAG edges govern</text><text x="82" y="512" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">eligibility. They do not</text><text x="82" y="554" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">prove learned causal</text><text x="82" y="596" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">prerequisites.</text><rect x="1160" y="210" width="360" height="190" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="1160" y="210" width="7" height="190" fill="#167d8d"/><text x="1184" y="258" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">TRAIN</text><text x="1184" y="307" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Fixed tranche;</text><text x="1184" y="348" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">preserve RNG and</text><text x="1184" y="389" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">state</text><rect x="1160" y="455" width="360" height="190" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="1160" y="455" width="7" height="190" fill="#167d8d"/><text x="1184" y="503" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">PRE-PROBE</text><text x="1184" y="552" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Resume pending</text><text x="1184" y="593" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">probe before next</text><text x="1184" y="634" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">update</text><path d="M1340,410 L1340,440" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="1185" y="713" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#167d8d" font-weight="700" text-anchor="start">DEV decides promotion</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">S0 unlocks S1, S2 and S4; S1 plus S2 unlock S3. Mastery, retention and transfer gates are curriculum</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">decisions, not efficacy tests.</text></svg>