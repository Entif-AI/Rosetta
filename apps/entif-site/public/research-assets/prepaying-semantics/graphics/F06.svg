<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>A local falsifier should cause a local revision</title><desc>Argument dependencies</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F06 / ARGUMENT DEPENDENCIES</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">A local falsifier should cause a local revision</text><rect x="70" y="205" width="695" height="190" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="205" width="7" height="190" fill="#167d8d"/><text x="94" y="253" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#14303d" font-weight="700" text-anchor="start">Generic structure matches Bithkuil</text><text x="94" y="302" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Lose donor specificity; retain a</text><text x="94" y="343" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">possible explicit-structure result.</text><rect x="835" y="205" width="695" height="190" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="835" y="205" width="7" height="190" fill="#167d8d"/><text x="859" y="253" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Only token counts improve</text><text x="859" y="302" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Retain compactness; do not infer</text><text x="859" y="343" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">lower total training cost.</text><rect x="70" y="470" width="695" height="225" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="470" width="7" height="225" fill="#167d8d"/><text x="94" y="518" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#14303d" font-weight="700" text-anchor="start">Native tasks pass, transfer fails</text><text x="94" y="567" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Keep bounded competence; lose the</text><text x="94" y="608" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">tested later-interface claim.</text><rect x="835" y="470" width="695" height="225" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="835" y="470" width="7" height="225" fill="#ad622e"/><text x="859" y="518" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#14303d" font-weight="700" text-anchor="start">Competent control, no SYS benefit</text><text x="859" y="567" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">The tested representation-</text><text x="859" y="608" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">efficiency operationalization is</text><text x="859" y="649" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">unsupported.</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">The thesis contains distinct bridges. A negative result narrows the bridge it tests rather than silently</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">erasing independent findings.</text></svg>