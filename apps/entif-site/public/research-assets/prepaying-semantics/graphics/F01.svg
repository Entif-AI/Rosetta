<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>One world, several surfaces, one truth authority</title><desc>Architecture</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F01 / ARCHITECTURE</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">One world, several surfaces, one truth authority</text><rect x="70" y="200" width="410" height="210" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="200" width="7" height="210" fill="#167d8d"/><text x="94" y="248" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Donor grammar</text><text x="94" y="297" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Candidate</text><text x="94" y="338" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">distinctions and</text><text x="94" y="379" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">scope constraints</text><rect x="595" y="200" width="410" height="210" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="595" y="200" width="7" height="210" fill="#167d8d"/><text x="619" y="248" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Typed world + AST</text><text x="619" y="297" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Explicit finite</text><text x="619" y="338" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">semantics; donor</text><text x="619" y="379" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">mapping is partial</text><rect x="1120" y="200" width="410" height="210" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="1120" y="200" width="7" height="210" fill="#167d8d"/><text x="1144" y="248" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Lossless codecs</text><text x="1144" y="297" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Compact tokens or</text><text x="1144" y="338" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">controlled English</text><path d="M490,305 L580,305" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1015,305 L1105,305" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="595" y="530" width="410" height="205" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="595" y="530" width="7" height="205" fill="#ad622e"/><text x="619" y="578" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Formal oracle</text><text x="619" y="627" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Checks answers;</text><text x="619" y="668" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">teacher cannot set</text><text x="619" y="709" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">truth</text><rect x="1120" y="530" width="410" height="205" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="1120" y="530" width="7" height="205" fill="#167d8d"/><text x="1144" y="578" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Learner</text><text x="1144" y="627" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Same model;</text><text x="1144" y="668" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">representation and</text><text x="1144" y="709" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">teaching tested</text><path d="M800,420 L800,513" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1325,420 L1325,513" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1015,625 L1105,625" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="85" y="555" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#243943" font-weight="400" text-anchor="start">The external model</text><text x="85" y="599" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#243943" font-weight="400" text-anchor="start">proposes lessons. The</text><text x="85" y="643" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#243943" font-weight="400" text-anchor="start">validator decides</text><text x="85" y="687" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#243943" font-weight="400" text-anchor="start">what is admitted.</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">Donor facts motivate a representation. Only specified formal semantics determine gold answers. Later natural-</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">language transfer remains a hypothesis.</text></svg>