<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>A world-sensitive pair keeps the query fixed</title><desc>Endpoint definition</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F04 / ENDPOINT DEFINITION</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">A world-sensitive pair keeps the query fixed</text><rect x="70" y="200" width="1460" height="125" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="200" width="7" height="125" fill="#167d8d"/><text x="94" y="248" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Same query in both cases</text><text x="94" y="297" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Is entity 0 color 1?</text><rect x="95" y="390" width="610" height="255" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="95" y="390" width="7" height="255" fill="#167d8d"/><text x="119" y="438" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Original world</text><text x="119" y="487" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Entity 0 has color 1. Gold:</text><text x="119" y="528" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">TRUE (1, 0).</text><rect x="895" y="390" width="610" height="255" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="895" y="390" width="7" height="255" fill="#ad622e"/><text x="919" y="438" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Legal intervention</text><text x="919" y="487" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Only entity 0 color changes to</text><text x="919" y="528" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">2. Gold: FALSE (0, 1).</text><path d="M723,520 L875,520" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="95" y="725" font-family="DejaVu Sans,sans-serif" font-size="36" fill="#167d8d" font-weight="700" text-anchor="start">Pair score = 1 only when both answers are correct.</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">A deterministic query-only rule cannot answer both members correctly. Witness discovery is bounded; failure to</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">find one is not an impossibility proof.</text></svg>