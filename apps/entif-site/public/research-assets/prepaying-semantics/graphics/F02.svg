<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Renaming symbols is not hiding their factors</title><desc>Analytical control</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F02 / ANALYTICAL CONTROL</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">Renaming symbols is not hiding their factors</text><rect x="70" y="205" width="440" height="270" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="205" width="7" height="270" fill="#167d8d"/><text x="94" y="253" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Aligned factors</text><text x="94" y="302" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">c: color; p: intended</text><text x="94" y="343" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">purpose</text><rect x="580" y="205" width="440" height="270" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="580" y="205" width="7" height="270" fill="#167d8d"/><text x="604" y="253" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Coupled renaming</text><text x="604" y="302" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Permute token IDs and</text><text x="604" y="343" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">embedding rows</text><text x="604" y="384" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">together</text><rect x="1090" y="205" width="440" height="270" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="1090" y="205" width="7" height="270" fill="#ad622e"/><text x="1114" y="253" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Nonseparable mixing</text><text x="1114" y="302" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">u = c + p mod 3; v =</text><text x="1114" y="343" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">c + 2p mod 3</text><text x="95" y="550" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#167d8d" font-weight="700" text-anchor="start">Same information</text><text x="95" y="602" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">Every supported</text><text x="95" y="644" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">original state is</text><text x="95" y="686" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">recoverable.</text><text x="605" y="550" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#167d8d" font-weight="700" text-anchor="start">Symmetry check</text><text x="605" y="602" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">The tested training</text><text x="605" y="644" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">trajectory is</text><text x="605" y="686" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">preserved.</text><text x="1115" y="550" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#ad622e" font-weight="700" text-anchor="start">Access-cost test</text><text x="1115" y="602" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">Recover c = 2u - v; p =</text><text x="1115" y="644" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#243943" font-weight="400" text-anchor="start">v - u (mod 3).</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">The mixed control changes local factor access without deleting information. A learning advantage under this</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">transformation is not assumed.</text></svg>