<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Test the integrated system before attribution</title><desc>Proposed experiment</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F05 / PROPOSED EXPERIMENT</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">Test the integrated system before attribution</text><rect x="70" y="195" width="1460" height="140" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="195" width="7" height="140" fill="#167d8d"/><text x="94" y="243" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Shared envelope</text><text x="94" y="292" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Eight paired seeds; fixed topology, oracle, exposure cap and evaluation</text><text x="94" y="333" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">contract</text><rect x="95" y="405" width="610" height="220" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="95" y="405" width="7" height="220" fill="#167d8d"/><text x="119" y="453" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">SYS-B</text><text x="119" y="502" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Bithkuil codec + ternary</text><text x="119" y="543" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">learner + adaptive teacher</text><rect x="895" y="405" width="610" height="220" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="895" y="405" width="7" height="220" fill="#167d8d"/><text x="919" y="453" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">SYS-C</text><text x="919" y="502" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Controlled-English codec + same</text><text x="919" y="543" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">learner + same teacher</text><text x="919" y="584" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">framework</text><path d="M395,340 L395,390" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1200,340 L1200,390" stroke="#167d8d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="90" y="710" font-family="DejaVu Sans,sans-serif" font-size="33" fill="#167d8d" font-weight="700" text-anchor="start">Lesson sequences may diverge through different learner errors.</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">A positive SYS result is a total adaptive-system effect. Matched replay and component interventions follow; no</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">scientific SYS run is reported here.</text></svg>