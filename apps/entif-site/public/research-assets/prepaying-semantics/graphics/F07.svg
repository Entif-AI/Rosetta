<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>What was actually executed</title><desc>Local engineering receipts</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F07 / LOCAL ENGINEERING RECEIPTS</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">What was actually executed</text><rect x="70" y="220" width="695" height="215" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="220" width="7" height="215" fill="#167d8d"/><text x="94" y="268" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start"></text><text x="98" y="292" font-family="DejaVu Sans,sans-serif" font-size="58" fill="#167d8d" font-weight="700" text-anchor="start">29</text><text x="98" y="337" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#14303d" font-weight="700" text-anchor="start">test methods</text><text x="98" y="384" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">Oracle, codec, recovery and boundary</text><text x="98" y="420" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">checks</text><rect x="835" y="220" width="695" height="215" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="835" y="220" width="7" height="215" fill="#167d8d"/><text x="859" y="268" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start"></text><text x="863" y="292" font-family="DejaVu Sans,sans-serif" font-size="58" fill="#167d8d" font-weight="700" text-anchor="start">2,880</text><text x="863" y="337" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#14303d" font-weight="700" text-anchor="start">codec round trips</text><text x="863" y="384" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">360 generated cases across eight</text><text x="863" y="420" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">codec/order views</text><rect x="70" y="485" width="695" height="215" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="70" y="485" width="7" height="215" fill="#167d8d"/><text x="94" y="533" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start"></text><text x="98" y="557" font-family="DejaVu Sans,sans-serif" font-size="58" fill="#167d8d" font-weight="700" text-anchor="start">4</text><text x="98" y="602" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#14303d" font-weight="700" text-anchor="start">tiny smoke runs</text><text x="98" y="649" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">Four steps, sixteen semantic</text><text x="98" y="685" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">exposures per run</text><rect x="835" y="485" width="695" height="215" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="835" y="485" width="7" height="215" fill="#167d8d"/><text x="859" y="533" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start"></text><text x="863" y="557" font-family="DejaVu Sans,sans-serif" font-size="58" fill="#167d8d" font-weight="700" text-anchor="start">53,408</text><text x="863" y="602" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#14303d" font-weight="700" text-anchor="start">parameters per smoke model</text><text x="863" y="649" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">Identical shape across precision and</text><text x="863" y="685" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#243943" font-weight="400" text-anchor="start">codec arms</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">Executed on the recorded CPU environment. These receipts validate a small implementation path, not comparative</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">efficacy, native low-bit efficiency or independent replication.</text></svg>