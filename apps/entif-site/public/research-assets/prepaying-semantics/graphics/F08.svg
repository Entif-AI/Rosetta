<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Efficiency has a first-use bill</title><desc>Cost identity</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167d8d"/></marker></defs><rect width="1600" height="900" fill="#fafbf9"/><text x="70" y="70" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#62717a" font-weight="400" text-anchor="start">F08 / COST IDENTITY</text><text x="70" y="128" font-family="DejaVu Sans,sans-serif" font-size="43" fill="#14303d" font-weight="700" text-anchor="start">Efficiency has a first-use bill</text><text x="100" y="265" font-family="DejaVu Sans,sans-serif" font-size="37" fill="#14303d" font-weight="700" text-anchor="start">TOTAL COST = FIXED CONSTRUCTION + N x RECURRING COST</text><rect x="100" y="340" width="635" height="245" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="100" y="340" width="7" height="245" fill="#167d8d"/><text x="124" y="388" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Construction</text><text x="124" y="437" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Ontology, compiler, teacher</text><text x="124" y="478" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">design, validation and human</text><text x="124" y="519" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">operation</text><rect x="855" y="340" width="635" height="245" rx="10" fill="white" stroke="#d7e0df" stroke-width="2"/><rect x="855" y="340" width="7" height="245" fill="#167d8d"/><text x="879" y="388" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#14303d" font-weight="700" text-anchor="start">Recurring</text><text x="879" y="437" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">Proposal + learner + evaluation</text><text x="879" y="478" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#243943" font-weight="400" text-anchor="start">+ recovery, including failures</text><text x="100" y="675" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#167d8d" font-weight="700" text-anchor="start">Break-even requires measured savings in compatible units.</text><text x="100" y="735" font-family="DejaVu Sans,sans-serif" font-size="35" fill="#14303d" font-weight="400" text-anchor="start">F_B + N r_B &lt; F_C + N r_C</text><line x1="70" y1="801" x2="1530" y2="801" stroke="#d7e0df" stroke-width="2"/><text x="70" y="843" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">Conceptual accounting identity, not an empirical curve. Unknown energy and costs remain unknown. Token savings</text><text x="70" y="877" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#62717a" font-weight="400" text-anchor="start">alone do not pay the complete bill.</text></svg>