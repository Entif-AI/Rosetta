<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" role="img"><title>Local soundness does not ensure confluence</title><desc>The same negative source reaches a precise or a coarsened union representation through two sound paths.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285b54"/></marker></defs><rect width="1500" height="730" fill="white"/><text x="55" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#285b54">ENTIF.AI  /  ETR-2026-04</text><text x="55" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#152c32">Local soundness does not ensure confluence</text><rect x="55" y="265" width="285" height="185" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="197" y="317" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#152c32">SOURCE</text><text x="197" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="#152c32">Known negative</text><text x="197" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="#152c32">{N}</text><rect x="480" y="165" width="360" height="140" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="660" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#152c32">EXACT PATH</text><text x="660" y="266" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#152c32">Preserve {N}</text><rect x="480" y="430" width="360" height="140" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="660" y="478" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#152c32">COARSENING PATH</text><text x="660" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#152c32">Legacy {N, I, U}</text><rect x="1030" y="235" width="410" height="245" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1235" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#152c32">SAME TARGET SCHEMA</text><text x="1235" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#152c32">Path 1: {N}</text><text x="1235" y="393" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#152c32">Path 2: {N, I, U}</text><text x="1235" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#152c32">Different joint answers</text><line x1="340" y1="302" x2="480" y2="233" stroke="#285b54" stroke-width="4" marker-end="url(#a)"/><line x1="340" y1="411" x2="480" y2="500" stroke="#285b54" stroke-width="4" marker-end="url(#a)"/><line x1="840" y1="233" x2="1030" y2="298" stroke="#285b54" stroke-width="4" marker-end="url(#a)"/><line x1="840" y1="500" x2="1030" y2="417" stroke="#285b54" stroke-width="4" marker-end="url(#a)"/><text x="750" y="638" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#152c32">Both paths avoid invented certainty. Only one retains full precision.</text><text x="55" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#7b622e">Synthetic finite example. Confluence is relative to a fixed task and oracle.</text></svg>