<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" role="img"><title>Ten proposed conservation obligations</title><desc>Ten architectural non-amplification obligations, not physical conservation laws or proven system guarantees.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285b54"/></marker></defs><rect width="1500" height="730" fill="white"/><text x="55" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#285b54">ENTIF.AI  /  ETR-2026-04</text><text x="55" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#152c32">Ten proposed conservation obligations</text><rect x="55" y="185" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="185" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">MEANING</text><text x="185" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No silent invention</text><rect x="337" y="185" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="467" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">IDENTITY</text><text x="467" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No unproved merge</text><rect x="619" y="185" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="749" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">CAUSALITY</text><text x="749" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No invented order</text><rect x="901" y="185" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1031" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">AUTHORITY</text><text x="1031" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No scope expansion</text><rect x="1183" y="185" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1313" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">RIGHTS</text><text x="1313" y="299" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No widened access</text><rect x="55" y="384" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="185" y="441" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">SECURITY</text><text x="185" y="498" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No unsafe fallback</text><rect x="337" y="384" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="467" y="441" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">EFFECTS</text><text x="467" y="498" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No duplicate action</text><rect x="619" y="384" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="749" y="441" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">INDEPENDENCE</text><text x="749" y="498" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No echo as evidence</text><rect x="901" y="384" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1031" y="441" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">UNCERTAINTY</text><text x="1031" y="498" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No guessed certainty</text><rect x="1183" y="384" width="260" height="165" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1313" y="441" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#152c32">VIEW IDENTITY</text><text x="1313" y="498" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#152c32">No stale-as-current</text><text x="750" y="625" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#152c32">Locally valid artifacts can still compose into an invalid end-to-end claim.</text><text x="55" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#7b622e">Proposed architecture obligations. Separate from the finite proof in this publication.</text></svg>