<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" role="img"><title>Three motivations; no borrowed validation</title><desc>The three companion reports motivate separate prospective uses, without validating Rosetta or each other.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285b54"/></marker></defs><rect width="1500" height="730" fill="white"/><text x="55" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#285b54">ENTIF.AI  /  ETR-2026-04</text><text x="55" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#152c32">Three motivations; no borrowed validation</text><rect x="55" y="175" width="440" height="368" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="275" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#285b54">ETR-2026-01</text><text x="275" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#152c32">Grounding and correction</text><text x="275" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Source versus inference</text><text x="275" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Current versus superseded</text><text x="275" y="463" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#152c32">Test fewer unsupported</text><text x="275" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#152c32">claims and better correction.</text><line x1="275" y1="547" x2="275" y2="580" stroke="#285b54" stroke-width="4" marker-end="url(#a)"/><rect x="530" y="175" width="440" height="368" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="750" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#285b54">ETR-2026-02</text><text x="750" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#152c32">Auditable machine exchange</text><text x="750" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Declared transformations</text><text x="750" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Residual channels and utility</text><text x="750" y="463" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#152c32">Test bounded transfer</text><text x="750" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#152c32">rather than promise secrecy.</text><line x1="750" y1="547" x2="750" y2="580" stroke="#285b54" stroke-width="4" marker-end="url(#a)"/><rect x="1005" y="175" width="440" height="368" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1225" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#285b54">ETR-2026-03</text><text x="1225" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#152c32">Institutional adaptation</text><text x="1225" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Accountable decisions</text><text x="1225" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Version change and remedy</text><text x="1225" y="463" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#152c32">Test contestability; records</text><text x="1225" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#152c32">do not confer legitimacy.</text><line x1="1225" y1="547" x2="1225" y2="580" stroke="#285b54" stroke-width="4" marker-end="url(#a)"/><rect x="55" y="586" width="1390" height="62" rx="10" fill="#152c32" stroke="#9cafa7" stroke-width="2"/><text x="750" y="628" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="white">Shared requirement: inspectable evidence, bounded authority, explicit uncertainty</text><text x="55" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#7b622e">Prospective applications. Shared authorship is not independent confirmation.</text></svg>