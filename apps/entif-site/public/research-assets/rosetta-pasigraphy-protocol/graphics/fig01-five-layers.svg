<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" role="img"><title>Different evidence for different questions</title><desc>Five distinct questions: integrity, identity, semantics, justification, and authority. No answer substitutes for all the others.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285b54"/></marker></defs><rect width="1500" height="730" fill="white"/><text x="55" y="48" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#285b54">ENTIF.AI  /  ETR-2026-04</text><text x="55" y="111" font-family="Liberation Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" fill="#152c32">Different evidence for different questions</text><rect x="55" y="190" width="260" height="398" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="185" y="243" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#152c32">INTEGRITY</text><text x="185" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">Did the bound</text><text x="185" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">bytes change?</text><line x1="83" y1="405" x2="287" y2="405" stroke="#9cafa7"/><text x="185" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Not: the claim</text><text x="185" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">is true.</text><rect x="337" y="190" width="260" height="398" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="467" y="243" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#152c32">IDENTITY</text><text x="467" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">Which entity and</text><text x="467" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">which revision?</text><line x1="365" y1="405" x2="569" y2="405" stroke="#9cafa7"/><text x="467" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Not: similarity</text><text x="467" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">proves sameness.</text><rect x="619" y="190" width="260" height="398" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="749" y="243" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#152c32">SEMANTICS</text><text x="749" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">What does this</text><text x="749" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">representation say?</text><line x1="647" y1="405" x2="851" y2="405" stroke="#9cafa7"/><text x="749" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Not: its meaning</text><text x="749" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">is justified.</text><rect x="901" y="190" width="260" height="398" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1031" y="243" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#152c32">JUSTIFICATION</text><text x="1031" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">What evidence</text><text x="1031" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">supports it?</text><line x1="929" y1="405" x2="1133" y2="405" stroke="#9cafa7"/><text x="1031" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Not: evidence</text><text x="1031" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">grants permission.</text><rect x="1183" y="190" width="260" height="398" rx="10" fill="#eff4f1" stroke="#9cafa7" stroke-width="2"/><text x="1313" y="243" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#152c32">AUTHORITY</text><text x="1313" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">Who may do</text><text x="1313" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#152c32">what, now?</text><line x1="1211" y1="405" x2="1415" y2="405" stroke="#9cafa7"/><text x="1313" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">Not: every future</text><text x="1313" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#152c32">use is allowed.</text><text x="55" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#7b622e">Architectural reading guide. Not a deployed verification stack.</text></svg>