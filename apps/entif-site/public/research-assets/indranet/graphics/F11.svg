<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">One object, several legitimate views</title><desc id="desc">Proposed consumer views over shared evidence. The reference exercises purpose filtering; accessibility and full XR runtime behavior remain design work.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#006F75"/></marker></defs><rect width="1200" height="680" fill="white"/><rect x="48" y="48" width="52" height="5" fill="#006F75"/><text x="112" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#516572" text-anchor="start">INDRANET / F11</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#132B3A" text-anchor="start">One object, several legitimate views</text><text x="48" y="155" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#516572" text-anchor="start">Shared identity does not require identical disclosure.</text><path d="M378,310 L423,310" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M213,405 L325,437" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M213,213 L213,195 L987,195 L987,213" stroke="#006F75" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="72" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Shared object</text><text x="72" y="296" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">history</text><text x="72" y="335" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Sources, associations</text><text x="72" y="364" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">and change</text><rect x="435" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="459" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">XR participant</text><text x="459" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Visible pose and</text><text x="459" y="336" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">interaction</text><rect x="822" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="846" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">AI assistant</text><text x="846" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Grounded evidence +</text><text x="846" y="336" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">uncertainty</text><rect x="260" y="450" width="680" height="135" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="260" y="450" width="7" height="135" rx="3" fill="#006F75"/><text x="284" y="490" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Operator</text><text x="284" y="532" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Detailed authorized context</text><line x1="48" y1="637" x2="1152" y2="637" stroke="