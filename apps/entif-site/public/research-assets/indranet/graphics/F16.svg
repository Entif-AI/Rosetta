<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Generative Reality: prior, state, witness</title><desc id="desc">Conceptual Generative Reality architecture. No neural decoder or communication-saving benchmark was executed. All three input strata contribute to total cost.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#006F75"/></marker></defs><rect width="1200" height="680" fill="white"/><rect x="48" y="48" width="52" height="5" fill="#006F75"/><text x="112" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#516572" text-anchor="start">INDRANET / F16</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#132B3A" text-anchor="start">Generative Reality: prior, state, witness</text><text x="48" y="155" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#516572" text-anchor="start">Reconstruct an experience under an explicit contract.</text><path d="M213,405 L600,438" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M600,405 L600,438" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M987,405 L600,438" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="48" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="72" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Prepared prior</text><text x="72" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Scene, assets and model</text><text x="72" y="336" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">versions</text><rect x="435" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="459" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Dynamic state</text><text x="459" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Motion, events and</text><text x="459" y="336" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">change</text><rect x="822" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="846" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Fresh witnesses</text><text x="846" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Appearance evidence and</text><text x="846" y="336" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">novelty</text><rect x="260" y="450" width="680" height="135" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="260" y="450" width="7" height="135" rx="3" fill="#006F75"/><text x="284" y="490" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Receiver contract</text><text x="284" y="532" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Purpose, fidelity and capabilities</text><line x1="48" y1="637" x2="1152" y2="637" stroke="#A7BBC3"/><text x="48" y="665" font-family="DejaVu Sans, sans-serif" font-size="1