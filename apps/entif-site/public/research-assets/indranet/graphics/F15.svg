<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Several futures, one preserved history</title><desc id="desc">Conceptual epistemic branch graph. Prediction, simulation, counterfactual and measured history remain separate.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#006F75"/></marker></defs><rect width="1200" height="680" fill="white"/><rect x="48" y="48" width="52" height="5" fill="#006F75"/><text x="112" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#516572" text-anchor="start">INDRANET / F15</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#132B3A" text-anchor="start">Several futures, one preserved history</text><text x="48" y="155" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#516572" text-anchor="start">Retain the branch that produced each output.</text><path d="M563,297 L625,297" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M563,512 L625,512" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M305,385 L305,423" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M895,385 L895,423" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="48" y="220" width="515" height="155" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="220" width="7" height="155" rx="3" fill="#006F75"/><text x="72" y="260" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Observed history</text><text x="72" y="302" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Source evidence remains fixed</text><rect x="637" y="220" width="515" height="155" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="637" y="220" width="7" height="155" rx="3" fill="#006F75"/><text x="661" y="260" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Predicted branch</text><text x="661" y="302" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">What may happen next</text><rect x="48" y="435" width="515" height="155" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="435" width="7" height="155" rx="3" fill="#006F75"/><text x="72" y="475" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Counterfactual branch</text><text x="72" y="517" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">What could happen otherwise</text><rect x="637" y="435" width="515" height="155" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="637" y="435" width="7" height="155" rx="3" fill="#006F75"/><text x="661" y="475" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Refinement</text><text x="661" y="517" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">New hypothesis; prior retained</text><line x1="48" y1="637" x2="1152" y2="637" stroke="#A7BBC3"/><text x="48" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="start">Source-linked architecture and reference diagrams</text><text x="1152" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="end">v0.5.0</text></svg>