<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Compose standards, preserve their meanings</title><desc id="desc">Selected-profile composition retains source meanings and explicit sidecars. The locating adapter is an independent reference, not tested omlox vendor interoperability. Both strong NGSI and composed profiles preserve the selected fields in the local round-trip exercise.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#006F75"/></marker></defs><rect width="1200" height="680" fill="white"/><rect x="48" y="48" width="52" height="5" fill="#006F75"/><text x="112" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#516572" text-anchor="start">INDRANET / F03</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#132B3A" text-anchor="start">Compose standards, preserve their meanings</text><text x="48" y="155" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#516572" text-anchor="start">NGSI-LD, SensorThings, GeoPose and a locating reference.</text><path d="M213,388 L480,418" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M987,388 L720,418" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M600,389 L600,417" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M378,512 L423,512" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M765,512 L810,512" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="213" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="213" width="7" height="166" rx="3" fill="#006F75"/><text x="72" y="253" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">NGSI-LD</text><text x="72" y="295" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Context entities and</text><text x="72" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">properties</text><rect x="435" y="213" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="213" width="7" height="166" rx="3" fill="#006F75"/><text x="459" y="253" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">SensorThings</text><text x="459" y="295" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Observation result and</text><text x="459" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">source</text><rect x="822" y="213" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="213" width="7" height="166" rx="3" fill="#006F75"/><text x="846" y="253" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">GeoPose</text><text x="846" y="295" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Explicit global</text><text x="846" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">position and pose</text><rect x="48" y="429" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="429" width="7" height="166" rx="3" fill="#006F75"/><text x="72" y="469" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Locating reference</text><text x="72" y="511" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Independent model; not</text><text x="72" y="540" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">omlox conformance</text><rect x="435" y="429" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="429" width="7" height="166" rx="3" fill="#006F75"/><text x="459" y="469" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Qualified profile</text><text x="459" y="511" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Bindings, sidecars and</text><text x="459" y="540" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">explicit loss</text><rect x="822" y="429" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="429" width="7" height="166" rx="3" fill="#006F75"/><text x="846" y="469" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Optional Rosetta</text><text x="846" y="511" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Trace and immutable</text><text x="846" y="540" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">evidence</text><line x1="48" y1="637" x2="1152" y2="637" stroke="#A7BBC3"/><text x="48" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="start">Source-linked architecture and reference diagrams</text><text x="1152" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="end">v0.5.0</text></svg>