<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">The responsive-room fixture</title><desc id="desc">Executed synthetic performance example: /indranet/demo/light/level = 80 and /indranet/demo/sound/send = 35. Both record sent:false and actuationAuthority:false.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#006F75"/></marker></defs><rect width="1200" height="680" fill="white"/><rect x="48" y="48" width="52" height="5" fill="#006F75"/><text x="112" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#516572" text-anchor="start">INDRANET / F10</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#132B3A" text-anchor="start">The responsive-room fixture</text><text x="48" y="155" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#516572" text-anchor="start">The same gesture, two context-bound previews.</text><path d="M378,310 L423,310" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600,404 L600,438" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M213,213 L213,195 L987,195 L987,213" stroke="#006F75" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="72" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Shared gesture</text><text x="72" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">One immutable gesture</text><text x="72" y="336" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">artifact</text><rect x="435" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="459" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Light-sculpture</text><text x="459" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Light level: 80</text><rect x="822" y="225" width="330" height="170" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="225" width="7" height="170" rx="3" fill="#006F75"/><text x="846" y="265" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Sound-sculpture</text><text x="846" y="307" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Sound send: 35</text><rect x="260" y="450" width="680" height="135" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="260" y="450" width="7" height="135" rx="3" fill="#B46622"/><text x="284" y="490" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#B46622" text-anchor="start">Old preview</text><text x="284" y="532" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Refused: context-changed</text><line x1="48" y1="637" x2="1152" y2="637" stroke="#A7BBC3"/><text x="48" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="start">Source-linked architecture and reference diagrams</text><text x="1152" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="end">v0.5.0</text></svg>