<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Partner-first sensing</title><desc id="desc">Proposed modality-neutral participation. Existing product capability is attributed to its source; no commercial partnership or hardware test is implied.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#006F75"/></marker></defs><rect width="1200" height="680" fill="white"/><rect x="48" y="48" width="52" height="5" fill="#006F75"/><text x="112" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#516572" text-anchor="start">INDRANET / F09</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#132B3A" text-anchor="start">Partner-first sensing</text><text x="48" y="155" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#516572" text-anchor="start">Different providers can retain different strengths.</text><rect x="48" y="260" width="330" height="210" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="260" width="7" height="210" rx="3" fill="#006F75"/><text x="72" y="300" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">RTLS and UWB</text><text x="72" y="342" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Location estimates +</text><text x="72" y="371" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">quality</text><rect x="435" y="260" width="330" height="210" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="260" width="7" height="210" rx="3" fill="#006F75"/><text x="459" y="300" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Vision and motion</text><text x="459" y="342" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Geometry, pose and</text><text x="459" y="371" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">gestures</text><rect x="822" y="260" width="330" height="210" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="260" width="7" height="210" rx="3" fill="#006F75"/><text x="846" y="300" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Facility + robot</text><text x="846" y="331" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">APIs</text><text x="846" y="370" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Asset and operational</text><text x="846" y="399" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">state</text><line x1="48" y1="637" x2="1152" y2="637" stroke="#A7BBC3"/><text x="48" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="start">Source-linked architecture and reference diagrams</text><text x="1152" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="end">v0.5.0</text></svg>