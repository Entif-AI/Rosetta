<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">From context to a bounded action request</title><desc id="desc">Conceptual process trace. The local performance fixture stops at serialized previews and refuses an obsolete context; no command is sent.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#006F75"/></marker></defs><rect width="1200" height="680" fill="white"/><rect x="48" y="48" width="52" height="5" fill="#006F75"/><text x="112" y="57" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#516572" text-anchor="start">INDRANET / F08</text><text x="48" y="113" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="600" fill="#132B3A" text-anchor="start">From context to a bounded action request</text><text x="48" y="155" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#516572" text-anchor="start">State evidence alone cannot authorize an effect.</text><path d="M378,296 L423,296" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M765,296 L810,296" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M378,512 L423,512" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M765,512 L810,512" stroke="#006F75" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M987,389 L987,404 L213,404 L213,417" stroke="#006F75" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="48" y="213" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="213" width="7" height="166" rx="3" fill="#006F75"/><text x="72" y="253" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Interpret event</text><text x="72" y="295" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Evidence + current mode</text><rect x="435" y="213" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="213" width="7" height="166" rx="3" fill="#006F75"/><text x="459" y="253" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Compile preview</text><text x="459" y="295" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Bind exact context</text><text x="459" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">identity</text><rect x="822" y="213" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="213" width="7" height="166" rx="3" fill="#006F75"/><text x="846" y="253" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Recheck admission</text><text x="846" y="295" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Authority and context</text><text x="846" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">still valid?</text><rect x="48" y="429" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="48" y="429" width="7" height="166" rx="3" fill="#006F75"/><text x="72" y="469" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Attempt effect</text><text x="72" y="511" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Only in an authorized</text><text x="72" y="540" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">controller</text><rect x="435" y="429" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="435" y="429" width="7" height="166" rx="3" fill="#006F75"/><text x="459" y="469" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Observe feedback</text><text x="459" y="511" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">What actually returned</text><rect x="822" y="429" width="330" height="166" rx="16" fill="#EEF5F6" stroke="#A7BBC3" stroke-width="1.5"/><rect x="822" y="429" width="7" height="166" rx="3" fill="#006F75"/><text x="846" y="469" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#006F75" text-anchor="start">Evaluate + record</text><text x="846" y="511" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">Bounded outcome, not</text><text x="846" y="540" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#132B3A" text-anchor="start">world truth</text><line x1="48" y1="637" x2="1152" y2="637" stroke="#A7BBC3"/><text x="48" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="start">Source-linked architecture and reference diagrams</text><text x="1152" y="665" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#516572" text-anchor="end">v0.5.0</text></svg>